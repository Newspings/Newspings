<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Newspings FX | Global Forex</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#07111f;
    color:#fff;
}

header{
    width:100%;
    padding:20px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#081525;
    border-bottom:1px solid #18304d;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:24px;
    font-weight:800;
    letter-spacing:1px;
}

.logo span{
    color:#20d6a3;
}

nav a{
    color:#c8d4e3;
    text-decoration:none;
    margin-left:25px;
    font-size:14px;
}

nav a:hover{
    color:#20d6a3;
}

.hero{
    min-height:620px;
    display:flex;
    align-items:center;
    padding:80px 7%;
    background:
    radial-gradient(circle at 80% 30%,#12385d 0,transparent 35%),
    linear-gradient(135deg,#07111f,#0a192c);
}

.hero-content{
    max-width:750px;
}

.badge{
    display:inline-block;
    padding:9px 15px;
    border:1px solid #20d6a3;
    border-radius:30px;
    color:#20d6a3;
    font-size:12px;
    margin-bottom:25px;
}

h1{
    font-size:58px;
    line-height:1.05;
    margin-bottom:25px;
}

h1 span{
    color:#20d6a3;
}

.hero p{
    color:#aebdd0;
    font-size:18px;
    line-height:1.7;
    margin-bottom:35px;
}

.buttons{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    padding:15px 25px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
    display:inline-block;
}

.primary{
    background:#20d6a3;
    color:#03120e;
}

.secondary{
    border:1px solid #36506e;
    color:white;
}

section{
    padding:75px 7%;
}

.section-title{
    text-align:center;
    margin-bottom:45px;
}

.section-title h2{
    font-size:35px;
    margin-bottom:10px;
}

.section-title p{
    color:#8fa1b5;
}

.markets{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.card{
    background:#0c1a2b;
    border:1px solid #1b324d;
    border-radius:14px;
    padding:25px;
}

.card h3{
    margin-bottom:15px;
}

.price{
    font-size:25px;
    font-weight:bold;
    margin-bottom:8px;
}

.up{
    color:#20d6a3;
}

.down{
    color:#ff6577;
}

.features{
    background:#091727;
}

.feature-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.feature{
    background:#0d1d30;
    border:1px solid #1a344e;
    border-radius:14px;
    padding:30px;
}

.feature-icon{
    font-size:30px;
    margin-bottom:18px;
}

.feature p{
    color:#94a8bd;
    line-height:1.6;
    margin-top:10px;
}

.register{
    background:linear-gradient(135deg,#0a1b2f,#07111f);
}

.form-box{
    max-width:600px;
    margin:auto;
    background:#0c1b2c;
    border:1px solid #23415e;
    padding:35px;
    border-radius:16px;
}

.form-box h2{
    text-align:center;
    margin-bottom:10px;
}

.form-box .sub{
    text-align:center;
    color:#8fa1b5;
    margin-bottom:25px;
}

input,select{
    width:100%;
    padding:15px;
    margin-bottom:15px;
    background:#07111f;
    border:1px solid #29435f;
    border-radius:8px;
    color:#fff;
    outline:none;
}

input:focus,select:focus
