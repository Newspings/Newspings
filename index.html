<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newspings Markets</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#050d14;
  color:#fff;
  line-height:1.6;
}

a{
  color:inherit;
  text-decoration:none;
}

.container{
  width:min(1120px,92%);
  margin:auto;
}

/* HEADER */

header{
  background:#030a11;
  border-bottom:1px solid #14232d;
  position:sticky;
  top:0;
  z-index:100;
}

.nav{
  min-height:78px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:.5px;
}

.logo span{
  color:#20dc79;

  display:flex;
  align-items:center;
  gap:10px;
}

nav a{
  color:#aebbc5;
  padding:9px 10px;
  font-size:14px;
}

nav a:hover{
  color:#20dc79;
}

/* BUTTON */

.btn{
  border:0;
  border-radius:12px;
  padding:13px 20px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-green{
  background:#20dc79;
  color:#031008;
}

.btn-dark{
  background:#101c25;
  color:#fff;
  border:1px solid #263944;
}

/* HERO */

.hero{

  background:

    linear-gradient(180deg,#07131c,#050d14);
}

.hero-grid{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:50px;
  align-items:center;
}
